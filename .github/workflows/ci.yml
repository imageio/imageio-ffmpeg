name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:

  lint-build:
    name: Linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install invoke black flake8
      - name: Lint
        run: |
            invoke lint
            invoke checkformat

  test-builds:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python versions
          - name: Linux py39
            os: ubuntu-latest
            pyversion: '3.9'
          - name: Linux py310
            os: ubuntu-latest
            pyversion: '3.10'
          - name: Linux py311
            os: ubuntu-latest
            pyversion: '3.11'
          - name: Linux py312
            os: ubuntu-latest
            pyversion: '3.12'
          - name: Linux py313
            os: ubuntu-latest
            pyversion: '3.13'
          - name: Linux pypy
            os: ubuntu-latest
            pyversion: 'pypy3.9'
          # OS's
          - name: Linux py313
            os: ubuntu-latest
            pyversion: '3.13'
          - name: Windows py313
            os: windows-latest
            pyversion: '3.13'
          - name: MacOS py313
            os: macos-latest
            pyversion: '3.13'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.pyversion }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyversion }}
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install psutil
            pip install invoke pytest pytest-cov
            invoke get-ffmpeg-binary
            pip install .
            rm -r ./imageio_ffmpeg
      - name: Test with pytest
        run: |
            python -c "import sys; print(sys.version, '\n', sys.prefix)";
            python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_version())'
            pytest tests -v --cov=imageio_ffmpeg --cov-report=term

  test-windows-arm64-wheel:
    name: Windows ARM64 wheel
    runs-on: windows-11-arm
    steps:
      - name: Check out imageio-ffmpeg
        uses: actions/checkout@v4
        with:
          path: imageio-ffmpeg
      - name: Check out Windows ARM64 FFmpeg binary
        uses: actions/checkout@v4
        with:
          repository: imageio/imageio-binaries
          ref: c0b43e6c2112c8973f09b95600cafdf145ce7e51
          path: imageio-binaries
          filter: blob:none
          sparse-checkout: ffmpeg/ffmpeg-win-aarch64-v8.1.exe
          sparse-checkout-cone-mode: false
      - name: Set up ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Build Windows ARM64 wheel
        working-directory: imageio-ffmpeg
        run: |
          python -m pip install --upgrade pip
          pip install invoke numpy pytest pytest-cov psutil wheel
          invoke build --platform=windows-aarch64
          $wheel = Get-Item dist\*win_arm64.whl
          if ($wheel.Name -notmatch '^imageio_ffmpeg-.+-py3-none-win_arm64\.whl$') { throw "Unexpected wheel: $($wheel.Name)" }
          pip install --force-reinstall $wheel.FullName
          Remove-Item imageio_ffmpeg -Recurse -Force
      - name: Test installed wheel
        working-directory: imageio-ffmpeg
        run: |
          python -c "import imageio_ffmpeg, platform; assert platform.machine().lower() in ('arm64', 'aarch64'); print(imageio_ffmpeg.get_ffmpeg_version())"
          pytest tests -v --cov=imageio_ffmpeg --cov-report=term
